<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <link rel="stylesheet" href="popup.css">
</head>
<body>
  <div class="header">
    <div class="brand">
      <span class="brand-icon">🛡️</span>
      <span>LinkShield</span>
    </div>
    <span class="version-tag">MV3</span>
  </div>

  <div class="input-section">
    <input type="text" id="urlInput" placeholder="Paste URL (e.g., https://example.com)">
    <button id="scanBtn" class="btn-primary">Analyze URL</button>
  </div>

  <div id="result">
    <div class="result-idle">Ready to analyze URL structure.</div>
  </div>

  <div class="history-section">
    <div class="history-header">
      <span class="history-title">Recent Scans</span>
      <button id="clearHistoryBtn" class="btn-clear">Clear</button>
    </div>
    <ul id="historyList" class="history-list">
      <li class="history-card" style="justify-content: center; color: var(--text-muted);">No recent scans.</li>
    </ul>
  </div>

  <script src="analyzer.js"></script>
  <script src="popup.js"></script>
</body>
</html>
